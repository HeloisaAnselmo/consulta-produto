<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Produtos</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

    <header>
    <div class="logo">

        <img src="img/Pena-removebg-preview.png" alt="Logo">

        <div>

            <h1>Consulta de Produtos</h1>

            <p>Consulta rápida de produtos ERP</p>

        </div>

    </div>

    </header>
    

    <main class="container">


        <section class="pesquisa">

            <h2>Pesquisar Produto</h2>

            <div class="campoPesquisa">

                <input
                    type="text"
                    id="codigoProduto"
                    placeholder="Digite ou leia o código de barras">

                <button id="btnPesquisar">

                    <i class="bi bi-search"></i>

                    Pesquisar

                </button>
                    
            </div>

        </section>
        <section id="conteudoProduto">
            <div class="tabs">

                <button class="tab active" data-tab="dados">
                    Dados Gerais
                </button>

                <button class="tab" data-tab="cores">
                    Cores
                </button>

                <button class="tab" data-tab="imagens">
                    Imagens
                </button>

            </div>
            <div class="conteudoTab active" id="dados">
                <div class="grid">
                    <div class="campo">
                        <label>Referência</label>
                        <input
                            type="text"
                            id="referencia"
                            readonly>

                    </div>
                    <div class="campo">
                        <label>Descrição</label>
                        <input
                            type="text"
                            id="descricao"
                            readonly>
                    </div>
                    <div class="campo">
                        <label>Grupo / Subgrupo</label>
                        <input
                            type="text"
                            id="grupo"
                            readonly>
                    </div>
                    <div class="campo">
                        <label>Empresa</label>
                        <input
                            type="text"
                            id="empresa"
                            readonly>

                    </div>
                    <div class="campo campoGrande">
                        <label>Composição Têxtil</label>
                        <textarea
                            id="composicao"
                            rows="5"
                            readonly></textarea>
                    </div>
                </div>
            </div>
           <div class="conteudoTab" id="cores">
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Cor</th>
                <th>Amostra</th>
                <th>Início</th>
                <th>Fim</th>
            </tr>
        </thead>
        <tbody id="tabelaCores">
        </tbody>
    </table>
</div>
           <div class="conteudoTab" id="imagens">
    <div class="galeria">
        <div class="cardImagem">
            <h3>Foto Frente</h3>
            <img
                id="fotoFrente"
                class="imagemProduto"
                src="img/"
                alt="Foto Frente">
            <p>Clique para ampliar</p>
        </div>
                    <div class="cardImagem">
                        <h3>Costas</h3>
                        <img
                            id="fotoCostas"
                            class="imagemProduto"
                            src="img/"
                            alt="Foto Costas">
                            <p>Clique para ampliar</p>
                    </div>
                    <div class="cardImagem">
                        <h3>Ficha Técnica</h3>
                        <img
                            id="fichaTecnica"
                            class="imagemProduto"
                            src="img/"
                            alt="Ficha Técnica">
                            <p>Clique para ampliar</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="modalImagem">

        <span id="fecharModal">&times;</span>

        <img id="imagemExpandida">

    </div>
    <footer>
    Desenvolvido pelo setor de TI • Consulta de Produtos ERP
</footer>
    <script src="js/consulta.js"></script>
</body>

</html>
